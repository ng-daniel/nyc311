models:
  - name: fct_311_complaints
    description: "Fact table of enriched 311 complaints for analytics"
    columns:
      - name: unique_key
        tests:
          - not_null
          - unique
      - name: created_at
        tests:
          - not_null
      - name: closed_at
      - name: created_date
      - name: borough
      - name: agency
      - name: complaint_type
      - name: status
      - name: resolution_hours
      - name: resolution_bucket
      - name: latitude
      - name: longitude
      - name: latitude_rounded
      - name: longitude_rounded

  - name: dim_borough
    description: "Dimension of borough values"
    columns:
      - name: borough
        tests:
          - not_null
          - unique

  - name: dim_agency
    description: "Dimension listing agencies"
    columns:
      - name: agency
        tests:
          - not_null
          - unique
      - name: agency_name

  - name: dim_complaint_type
    description: "Dimension of complaint categories and subtypes"
    columns:
      - name: complaint_type
        tests:
          - not_null
      - name: complaint_subtype
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - complaint_type
            - complaint_subtype

  - name: dim_date
    description: "Date dimension spanning 2010-2035"
    columns:
      - name: date_day
        tests:
          - not_null
          - unique
      - name: year
      - name: quarter
      - name: month
      - name: month_name
      - name: month_abbrev
      - name: week_of_year
      - name: day_of_year
      - name: day_of_month
      - name: day_of_week
      - name: day_name
      - name: day_abbrev
      - name: is_weekend
      - name: is_month_start
      - name: is_month_end
      - name: year_month
      - name: iso_year_week

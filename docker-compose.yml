services:
  postgres:
    image: postgres:17
    container_name: nyc311_postgres
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d
    restart: unless-stopped

  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.9.latest
    container_name: nyc311_dbt
    volumes:
      - ./dbt/nyc311_dbt:/usr/app/dbt
      - ./dbt/nyc311_dbt:/root/dbt
    env_file:
      - .env
    depends_on:
      - postgres

volumes:
  postgres_data: